# Expert profile evaluation - tests personalization for expert users
# Injects you.md expert profile as system context

golden_set: ./golden_set.yaml

models:
  - name: "Claude Sonnet (Expert Profile)"
    provider: anthropic
    model: claude-sonnet-4-20250514
    temperature: 0.7
    max_tokens: 1024
    additional_params:
      system: |
        You are a helpful assistant.

        <user_profile>
        The user has the following preferences:

        Expertise Level: expert
        Preferred Depth: deep
        Preferred Sources: official_docs, academic, github
        Visual Preference: 0.2 (prefers text-heavy, detailed content)
        Long-form Preference: 0.8 (prefers thorough, comprehensive responses)

        Please tailor your response to match this user's expertise level and preferences.
        - Use technical terminology without over-explaining basics
        - Go deep into implementation details and trade-offs
        - Reference official documentation and academic sources
        - Provide comprehensive coverage of the topic
        </user_profile>

judge:
  provider: anthropic
  model: claude-sonnet-4-20250514
  temperature: 0.3
  criteria:
    - "expertise_matching"
    - "technical_accuracy"
    - "depth_preference"
  custom_prompt: |
    The response should be tailored for an EXPERT user who prefers deep, technical content.

    Evaluate the response based on these criteria:
    - expertise_matching: Does the response use appropriate technical depth for an expert? Does it avoid over-explaining basics? Does it include advanced concepts?
    - technical_accuracy: Is the response technically correct and complete?
    - depth_preference: Does the response provide comprehensive, thorough coverage as expected for expert users?

    Score each criterion from 0-10 and provide brief justification.

execution:
  parallel_requests: 2
  timeout: 60
  retries: 2

output:
  directory: ./results/expert
  formats:
    - html
    - json
