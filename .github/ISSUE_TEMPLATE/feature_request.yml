name: Feature request
description: Suggest a new capability, tool integration, or protocol change
labels: [enhancement]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind of request
      options:
        - New AI tool integration (skill installer support)
        - New CLI capability
        - MCP server tool or behavior
        - Protocol / file format change
        - Docs
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that you.md does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you expect it to work? CLI commands, config, or profile syntax sketches welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
